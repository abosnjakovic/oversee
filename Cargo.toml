[package]
name = "oversee"
version = "0.3.9"
edition = "2024"
description = "A modern system monitor for macOS with Apple Silicon GPU support"
license = "MIT"
authors = ["abosnjakovic"]
repository = "https://github.com/abosnjakovic/oversee"
homepage = "https://github.com/abosnjakovic/oversee"
readme = "README.md"
keywords = ["macos", "monitor", "system", "gpu", "apple-silicon"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
ratatui = "0.29.0"
sysinfo = "0.32"
crossterm = "0.28"
libc = "0.2"

[features]
profile = []

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
strip = "none"


[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
